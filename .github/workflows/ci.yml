name: MangaPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Core Test Suite
        run: node tests/suite.js

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://mangapulse.vercel.app
          CRON_SECRET: test_ci_cron_secret
