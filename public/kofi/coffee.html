<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1000px;
      height: 1000px;
      background: #0c0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wrapper {
      position: relative;
      width: 580px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Outer glowing blue halo */
    .glow-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, rgba(37, 99, 235, 0.15) 50%, transparent 75%);
      filter: blur(35px);
    }
    /* Circular profile border - electric blue */
    .border-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 14px solid #3b82f6;
      box-shadow: 0 0 45px rgba(59, 130, 246, 0.75), inset 0 0 35px rgba(59, 130, 246, 0.5);
      background: #111622;
    }
    /* Inner subtle ring */
    .inner-ring {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 2px dashed rgba(96, 165, 250, 0.4);
    }
    /* Top center blurred badge */
    .top-badge {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1d4ed8;
      border: 4px solid #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.9);
      z-index: 10;
    }
    .top-badge svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Center coffee cup icon */
    .center-icon {
      position: relative;
      z-index: 5;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-icon svg {
      width: 220px;
      height: 220px;
      stroke: #60a5fa;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.8));
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="glow-aura"></div>
    <div class="border-ring"></div>
    <div class="inner-ring"></div>
    
    <!-- Top center coffee badge -->
    <div class="top-badge">
      <svg viewBox="0 0 24 24">
        <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
        <line x1="6" y1="2" x2="6" y2="4"/>
        <line x1="10" y1="2" x2="10" y2="4"/>
        <line x1="14" y1="2" x2="14" y2="4"/>
      </svg>
    </div>

    <!-- Center Coffee Icon -->
    <div class="center-icon">
      <svg viewBox="0 0 24 24">
        <!-- Steam wisps -->
        <path d="M7 2c0 2-2 3-2 5s2 3 2 5" stroke="#93c5fd" stroke-width="2.5" />
        <path d="M12 2c0 2-2 3-2 5s2 3 2 5" stroke="#60a5fa" stroke-width="2.5" />
        <path d="M17 2c0 2-2 3-2 5s2 3 2 5" stroke="#93c5fd" stroke-width="2.5" />
        <!-- Cup & Handle -->
        <path d="M17 9h2a3.5 3.5 0 0 1 0 7h-2" stroke="#3b82f6" stroke-width="2" />
        <path d="M4 9h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z" stroke="#60a5fa" stroke-width="2" />
        <!-- Saucer plate -->
        <path d="M2 21h18" stroke="#3b82f6" stroke-width="2" />
      </svg>
    </div>
  </div>
</body>
</html>
