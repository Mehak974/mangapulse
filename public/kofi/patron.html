<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1000px;
      height: 1000px;
      background: #0c0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wrapper {
      position: relative;
      width: 580px;
      height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Outer diamond platinum silver halo */
    .glow-aura {
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 250, 252, 0.45) 0%, rgba(203, 213, 225, 0.25) 50%, transparent 75%);
      filter: blur(40px);
    }
    /* Circular profile border - liquid shiny silver with diamond reflections */
    .border-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 14px solid #f1f5f9;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.85), 0 0 85px rgba(203, 213, 225, 0.5), inset 0 0 35px rgba(255, 255, 255, 0.6);
      background: #0f131a;
    }
    /* Inner platinum ring */
    .inner-ring {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 2.5px solid rgba(241, 245, 249, 0.55);
    }
    /* Top center Gleaming Crown Badge */
    .top-badge {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #cbd5e1, #94a3b8);
      border: 4px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(255, 255, 255, 1);
      z-index: 10;
    }
    .top-badge svg {
      width: 48px;
      height: 48px;
      fill: url(#silverGradient);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }
    /* Center Shiny Silver Crown */
    .center-icon {
      position: relative;
      z-index: 5;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-icon svg {
      width: 240px;
      height: 240px;
      filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 60px rgba(148, 163, 184, 0.6));
    }
    /* Floating sparkles */
    .sparkle {
      position: absolute;
      width: 24px;
      height: 24px;
      fill: #ffffff;
      filter: drop-shadow(0 0 10px #ffffff);
      z-index: 8;
    }
    .sp-1 { top: 75px; right: 90px; }
    .sp-2 { bottom: 85px; left: 80px; width: 28px; height: 28px; }
    .sp-3 { top: 120px; left: 100px; width: 18px; height: 18px; }
    .sp-4 { bottom: 110px; right: 85px; width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="glow-aura"></div>
    <div class="border-ring"></div>
    <div class="inner-ring"></div>
    
    <!-- Sparkles -->
    <svg class="sparkle sp-1" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>
    <svg class="sparkle sp-2" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>
    <svg class="sparkle sp-3" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>
    <svg class="sparkle sp-4" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>

    <!-- Top center Crown Badge -->
    <div class="top-badge">
      <svg viewBox="0 0 24 24">
        <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 14h14v2H5v-2z" fill="#0f172a" />
      </svg>
    </div>

    <!-- Center Luxurious Silver Crown -->
    <div class="center-icon">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="30%" stop-color="#e2e8f0" />
            <stop offset="55%" stop-color="#94a3b8" />
            <stop offset="80%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#cbd5e1" />
          </linearGradient>
          <linearGradient id="silverSheen" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#cbd5e1" />
            <stop offset="50%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>
        </defs>
        
        <!-- Crown base baseplate -->
        <rect x="18" y="72" width="64" height="9" rx="3" fill="url(#silverSheen)" stroke="#ffffff" stroke-width="1.8" />
        <!-- Crown jewels / diamonds on base -->
        <circle cx="28" cy="76.5" r="2.2" fill="#38bdf8" />
        <circle cx="50" cy="76.5" r="2.8" fill="#ffffff" />
        <circle cx="72" cy="76.5" r="2.2" fill="#38bdf8" />

        <!-- 5-peak majestic royal crown body -->
        <path d="M20,68 L14,34 L32,48 L50,22 L68,48 L86,34 L80,68 Z" fill="url(#silverGradient)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- Diamond peak spheres -->
        <circle cx="14" cy="32" r="4.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <circle cx="32" cy="46" r="3.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <circle cx="50" cy="20" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
        <circle cx="68" cy="46" r="3.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <circle cx="86" cy="32" r="4.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

        <!-- Center diamond crest -->
        <polygon points="50,40 57,52 50,64 43,52" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      </svg>
    </div>
  </div>
</body>
</html>
