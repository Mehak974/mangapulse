<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Solid Dark Background (NO gradient) -->
  <rect width="800" height="800" rx="32" fill="#0c0e12" stroke="#2563eb" stroke-width="3" />

  <!-- Inner Surface Card -->
  <rect x="40" y="40" width="720" height="720" rx="24" fill="#141820" stroke="#1e2430" stroke-width="2" />

  <!-- Badge Header Pill -->
  <rect x="250" y="80" width="300" height="38" rx="19" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.5" />
  <text x="400" y="105" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="3">TIER 2 • PULSE CHAMPION</text>

  <!-- Central Flat Icon: Stacked Manga Volumes + Pulse Diamond -->
  <g transform="translate(400, 290)">
    <circle r="120" fill="#0c0e12" stroke="#1e2430" stroke-width="2" />

    <!-- Volume 3 (Bottom) -->
    <rect x="-70" y="30" width="140" height="20" rx="4" fill="#1e2430" stroke="#2563eb" stroke-width="2.5" />
    <line x1="-55" y1="40" x2="45" y2="40" stroke="#60a5fa" stroke-width="2" />

    <!-- Volume 2 (Middle) -->
    <rect x="-60" y="0" width="140" height="20" rx="4" fill="#1a202c" stroke="#3b82f6" stroke-width="2.5" />
    <line x1="-45" y1="10" x2="55" y2="10" stroke="#93c5fd" stroke-width="2" />

    <!-- Volume 1 (Top Open Book) -->
    <path d="M0,-45 C-30,-60 -70,-60 -80,-35 L-80,-10 C-70,-35 -30,-35 0,-20 C30,-35 70,-35 80,-10 L80,-35 C70,-60 30,-60 0,-45 Z" fill="#1e2430" stroke="#60a5fa" stroke-width="3.5" />
    <line x1="0" y1="-45" x2="0" y2="-20" stroke="#ffffff" stroke-width="2.5" />

    <!-- Solid Diamond Emblem -->
    <g transform="translate(0, -75)">
      <polygon points="0,-18 16,0 0,18 -16,0" fill="#2563eb" stroke="#93c5fd" stroke-width="2.5" />
      <polygon points="0,-8 7,0 0,8 -7,0" fill="#ffffff" />
    </g>
  </g>

  <!-- Pricing & Title -->
  <text x="400" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Volume Patron</text>
  <text x="400" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#60a5fa" text-anchor="middle">$10 <tspan font-size="18" fill="#94a1b5" font-weight="500">/ Monthly Subscription</tspan></text>

  <!-- Divider -->
  <line x1="160" y1="590" x2="640" y2="590" stroke="#1e2430" stroke-width="2" />

  <!-- Perks List -->
  <text x="400" y="635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Blue Champion Profile Crest &amp; Supporter Badge</text>
  <text x="400" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a1b5" text-anchor="middle">Unlimited Custom Reading Collections &amp; Release Alerts</text>
  <text x="400" y="715" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5e6b82" text-anchor="middle">MANGAPULSE SUPPORTER TIER 2</text>
</svg>
