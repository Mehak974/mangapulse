<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlowVol" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </radialGradient>
    <linearGradient id="borderGradVol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="blueNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlowVol)" stroke="url(#borderGradVol)" stroke-width="4" />

  <!-- Digital Grid Floor in Background -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1.5">
    <line x1="100" y1="460" x2="700" y2="460" />
    <line x1="60" y1="510" x2="740" y2="510" />
    <line x1="20" y1="560" x2="780" y2="560" />
    <line x1="400" y1="420" x2="200" y2="600" />
    <line x1="400" y1="420" x2="600" y2="600" />
    <line x1="400" y1="420" x2="400" y2="600" />
  </g>

  <!-- Badge Header Pill -->
  <rect x="260" y="70" width="280" height="42" rx="21" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" />
  <text x="400" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#60a5fa" text-anchor="middle" letter-spacing="3">TIER 2 • PULSE CHAMPION</text>

  <!-- Central Glowing Icon: Manga Volume Stack with Pulse Diamond -->
  <g transform="translate(400, 310)" filter="url(#blueNeonGlow)">
    <!-- Aura Ring -->
    <circle r="145" fill="#1e1b4b" fill-opacity="0.4" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 6" />

    <!-- Book 3 (Bottom) -->
    <path d="M-85,35 L65,35 L85,60 L-65,60 Z" fill="#0f172a" stroke="#4f46e5" stroke-width="4" />
    <rect x="-85" y="45" width="150" height="15" rx="3" fill="#1e1b4b" stroke="#60a5fa" stroke-width="2" />
    <line x1="-80" y1="52" x2="55" y2="52" stroke="#e0e7ff" stroke-width="2" />

    <!-- Book 2 (Middle) -->
    <path d="M-75,0 L75,0 L95,25 L-55,25 Z" fill="#1e1b4b" stroke="#6366f1" stroke-width="4" />
    <rect x="-75" y="10" width="150" height="15" rx="3" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <line x1="-70" y1="17" x2="65" y2="17" stroke="#e0e7ff" stroke-width="2" />

    <!-- Book 1 (Top Open Tome) -->
    <path d="M0,-55 C-35,-75 -85,-75 -95,-45 L-95, -10 C-85,-40 -35,-40 0,-20 C35,-40 85,-40 95,-10 L95,-45 C85,-75 35,-75 0,-55 Z" fill="#0f172a" stroke="url(#bookGrad)" stroke-width="5" />
    <line x1="0" y1="-55" x2="0" y2="-20" stroke="#818cf8" stroke-width="4" />

    <!-- Floating Glowing Pulse Diamond / Crest -->
    <g transform="translate(0, -90)">
      <polygon points="0,-25 22,0 0,25 -22,0" fill="#3b82f6" fill-opacity="0.5" stroke="#93c5fd" stroke-width="3" />
      <polygon points="0,-12 11,0 0,12 -11,0" fill="#ffffff" />
    </g>
  </g>

  <!-- Pricing & Title -->
  <text x="400" y="540" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Volume Patron</text>
  <text x="400" y="595" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#60a5fa" text-anchor="middle">$10 <tspan font-size="18" fill="#94a3b8" font-weight="500">/ Monthly Subscription</tspan></text>

  <!-- Perks Divider -->
  <line x1="220" y1="630" x2="580" y2="630" stroke="#1e293b" stroke-width="2" />

  <!-- Perks Bullet List -->
  <text x="400" y="675" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">👑 Glowing Blue Champion Profile Crest</text>
  <text x="400" y="715" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">🔔 Unlimited Custom Collections &amp; Release Alerts</text>
  <text x="400" y="750" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Recommended for Avid Manga Readers</text>
</svg>
