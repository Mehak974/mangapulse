<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Solid Dark Background (NO gradient) -->
  <rect width="800" height="800" rx="32" fill="#0c0e12" stroke="#f59e0b" stroke-width="3" />

  <!-- Inner Surface Card -->
  <rect x="40" y="40" width="720" height="720" rx="24" fill="#141820" stroke="#1e2430" stroke-width="2" />

  <!-- Badge Header Pill -->
  <rect x="250" y="80" width="300" height="38" rx="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
  <text x="400" y="105" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">TIER 3 • ARCHIVAL GUILD</text>

  <!-- Central Flat Icon: Royal Crown & Ornate Book -->
  <g transform="translate(400, 290)">
    <circle r="120" fill="#0c0e12" stroke="#1e2430" stroke-width="2" />

    <!-- Open Ornate Tome (Flat) -->
    <path d="M0,-15 C-35,-35 -80,-35 -95,-12 L-95,25 C-80,5 -35,5 0,25 C35,5 80,5 95,25 L95,-12 C80,-35 35,-35 0,-15 Z" fill="#1c1917" stroke="#f59e0b" stroke-width="4" />
    <line x1="0" y1="-15" x2="0" y2="25" stroke="#fbbf24" stroke-width="3" />

    <!-- Floating Royal Crown (Flat Solid) -->
    <g transform="translate(0, -65)">
      <!-- Crown Base -->
      <path d="M-50,22 L50,22 L42,32 L-42,32 Z" fill="#b45309" stroke="#f59e0b" stroke-width="2.5" />
      <!-- Crown Spikes -->
      <path d="M-50,22 L-60,-15 L-25,8 L0,-28 L25,8 L60,-15 L50,22 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="3" stroke-linejoin="round" />
      <circle cx="-60" cy="-18" r="4.5" fill="#fef08a" />
      <circle cx="0" cy="-32" r="6" fill="#ffffff" />
      <circle cx="60" cy="-18" r="4.5" fill="#fef08a" />
    </g>
  </g>

  <!-- Pricing & Title -->
  <text x="400" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Archival Legend</text>
  <text x="400" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#fbbf24" text-anchor="middle">$25+ <tspan font-size="18" fill="#94a1b5" font-weight="500">/ Monthly or Lifetime VIP</tspan></text>

  <!-- Divider -->
  <line x1="160" y1="590" x2="640" y2="590" stroke="#1e2430" stroke-width="2" />

  <!-- Perks List -->
  <text x="400" y="635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">✓ VIP Golden Founder Crown &amp; Hall of Fame Listing</text>
  <text x="400" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a1b5" text-anchor="middle">Direct Input on Upcoming Manga Releases &amp; Catalog Additions</text>
  <text x="400" y="715" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5e6b82" text-anchor="middle">MANGAPULSE FOUNDING GUILD PATRON</text>
</svg>
