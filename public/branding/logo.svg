<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid Dark Canvas (NO gradient) -->
  <rect width="1024" height="1024" fill="#0c0e12" />

  <!-- MangaPulse Iconic White Box -->
  <rect x="162" y="162" width="700" height="700" rx="160" ry="160" fill="#ffffff" />

  <!-- Bold Monospace-Style MP Mark -->
  <text x="512" y="620" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="360" 
        text-anchor="middle" 
        letter-spacing="-24" 
        fill="#0c0e12">MP</text>

  <!-- Solid Electric Blue Pulse Dot (NO gradient) -->
  <circle cx="730" cy="290" r="50" fill="#2563eb" />
  <circle cx="730" cy="290" r="24" fill="#93c5fd" />
</svg>
