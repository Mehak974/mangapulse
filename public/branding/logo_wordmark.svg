<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <!-- Solid Dark Background (NO gradient) -->
  <rect width="1600" height="500" fill="#0c0e12" stroke="#1e2430" stroke-width="4" />

  <!-- Icon Badge (Left) -->
  <g transform="translate(140, 100)">
    <rect width="300" height="300" rx="68" fill="#ffffff" />
    <text x="150" y="210" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="160" 
          text-anchor="middle" 
          letter-spacing="-12" 
          fill="#0c0e12">MP</text>
    <circle cx="245" cy="55" r="22" fill="#2563eb" />
    <circle cx="245" cy="55" r="10" fill="#93c5fd" />
  </g>

  <!-- Typography Lockup (Right) -->
  <g transform="translate(500, 240)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="105" 
          letter-spacing="-2" 
          fill="#ffffff">MANGAPULSE</text>
    
    <!-- Solid INDEX Badge -->
    <rect x="740" y="-85" width="160" height="54" rx="10" fill="#1e2430" stroke="#2a3344" stroke-width="2" />
    <text x="820" y="-48" 
          font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" 
          font-size="24" 
          font-weight="700" 
          text-anchor="middle" 
          letter-spacing="3" 
          fill="#94a1b5">INDEX</text>

    <!-- Subtitle Line -->
    <text x="0" y="65" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
