<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Solid Dark Background (NO gradient) -->
  <rect width="800" height="800" rx="32" fill="#0c0e12" stroke="#10b981" stroke-width="3" />

  <!-- Inner Surface Card -->
  <rect x="40" y="40" width="720" height="720" rx="24" fill="#141820" stroke="#1e2430" stroke-width="2" />

  <!-- Badge Header Pill -->
  <rect x="260" y="80" width="280" height="38" rx="19" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <text x="400" y="105" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="3">TIER 1 • CHAPTER SCOUT</text>

  <!-- Central Flat Icon: Coffee Cup with Pulse Line -->
  <g transform="translate(400, 290)">
    <!-- Flat Circle Frame -->
    <circle r="120" fill="#0c0e12" stroke="#1e2430" stroke-width="2" />

    <!-- Coffee Steam Lines (Flat Solid) -->
    <path d="M-25,-60 C-30,-80 -15,-90 -22,-110" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
    <path d="M0,-65 C-5,-85 10,-95 5,-115" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" />
    <path d="M25,-60 C20,-80 35,-90 28,-110" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />

    <!-- Coffee Cup Body (Flat Solid) -->
    <path d="M-50,-40 L50,-40 C50,30 35,60 0,60 C-35,60 -50,30 -50,-40 Z" fill="#1e2430" stroke="#10b981" stroke-width="4" />
    
    <!-- Cup Handle -->
    <path d="M50,-25 C75,-25 75,15 45,20" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />

    <!-- Pulse ECG Line across Cup -->
    <path d="M-35,5 L-15,5 L-8,-18 L4,25 L14,-10 L22,5 L35,5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cup Saucer -->
    <ellipse cx="0" cy="70" rx="65" ry="8" fill="#0c0e12" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- Pricing & Title -->
  <text x="400" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Coffee Supporter</text>
  <text x="400" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#34d399" text-anchor="middle">$3 – $5 <tspan font-size="18" fill="#94a1b5" font-weight="500">/ One-time or Monthly</tspan></text>

  <!-- Divider -->
  <line x1="160" y1="590" x2="640" y2="590" stroke="#1e2430" stroke-width="2" />

  <!-- Perks List -->
  <text x="400" y="635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Official Supporter Badge on Profile</text>
  <text x="400" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a1b5" text-anchor="middle">Fuels Live Server Indexing &amp; Real-Time Trackers</text>
  <text x="400" y="715" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5e6b82" text-anchor="middle">MANGAPULSE SUPPORTER TIER 1</text>
</svg>
