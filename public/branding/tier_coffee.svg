<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#102a24" />
      <stop offset="60%" stop-color="#0a1210" />
      <stop offset="100%" stop-color="#060809" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="800" rx="36" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Speed Lines / Background Pattern -->
  <g opacity="0.08" stroke="#34d399" stroke-width="1.5">
    <line x1="400" y1="400" x2="100" y2="80" />
    <line x1="400" y1="400" x2="250" y2="50" />
    <line x1="400" y1="400" x2="550" y2="50" />
    <line x1="400" y1="400" x2="700" y2="80" />
    <line x1="400" y1="400" x2="750" y2="250" />
    <line x1="400" y1="400" x2="750" y2="550" />
    <line x1="400" y1="400" x2="50" y2="250" />
    <line x1="400" y1="400" x2="50" y2="550" />
  </g>

  <!-- Badge Header Pill -->
  <rect x="270" y="70" width="260" height="42" rx="21" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <text x="400" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="3">TIER 1 • CHAPTER SCOUT</text>

  <!-- Central Glowing Icon: Coffee Cup with Heartbeat Pulse -->
  <g transform="translate(400, 310)" filter="url(#neonGlow)">
    <!-- Outer Glow Circle -->
    <circle r="140" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Coffee Steam Waves -->
    <path d="M-30,-75 C-35,-105 -15,-115 -25,-140" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M0,-80 C-5,-110 15,-120 5,-150" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" />
    <path d="M30,-75 C25,-105 45,-115 35,-140" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" opacity="0.85" />

    <!-- Coffee Cup Body -->
    <path d="M-60,-50 L60,-50 C60,40 40,75 0,75 C-40,75 -60,40 -60,-50 Z" fill="#0f172a" stroke="url(#cupGrad)" stroke-width="6" />
    
    <!-- Cup Handle -->
    <path d="M60,-35 C95,-35 95,20 55,25" fill="none" stroke="url(#cupGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Pulse ECG Line across Cup -->
    <path d="M-45,5 L-20,5 L-10,-25 L5,35 L18,-15 L28,5 L45,5" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cup Saucer -->
    <ellipse cx="0" cy="85" rx="80" ry="12" fill="#0f172a" stroke="url(#cupGrad)" stroke-width="4" />
  </g>

  <!-- Pricing & Title -->
  <text x="400" y="540" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Coffee Supporter</text>
  <text x="400" y="595" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#34d399" text-anchor="middle">$3 – $5 <tspan font-size="18" fill="#94a3b8" font-weight="500">/ One-time or Monthly</tspan></text>

  <!-- Perks Divider -->
  <line x1="220" y1="630" x2="580" y2="630" stroke="#1e293b" stroke-width="2" />

  <!-- Perks Bullet List -->
  <text x="400" y="675" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Official Supporter Badge on Profile</text>
  <text x="400" y="715" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">☕ Fuel Server Indexing &amp; Live Countdowns</text>
  <text x="400" y="750" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">MangaPulse Supporter Network</text>
</svg>
